name: deploy

on:
  # master -> next, v* tags -> prod, other branches -> previews
  push:
    # Dependabot pushes get no repo secrets, so they cannot deploy
    branches: ["**", "!dependabot/**"]
    tags: ["v*"]
  delete:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.ref || github.ref }}
  # never cancel a prod deploy halfway
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: write
    outputs:
      url: ${{ steps.muelle.outputs.url }}
    steps:
      # lists the build on the muelle listing while it runs
      - uses: haztecaso/muelle@d2c9216b438720a9e52d1464f054619fdfd28a5a # v3.1.0
        with:
          endpoint: ${{ secrets.MUELLE_ENDPOINT }}
          site: twozeroeightthree
          secret: ${{ secrets.MUELLE_SECRET }}
          environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name == 'master' && 'next' || 'preview' }}
          action: announce
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # tags build the indexable prod site, everything else the noindex preview
      - run: nix build -L .#${{ github.ref_type == 'tag' && 'prod' || 'preview' }}
      # dereference the store symlink so the artifact holds plain files
      - run: cp -rL result site
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 1
      - id: muelle
        uses: haztecaso/muelle@d2c9216b438720a9e52d1464f054619fdfd28a5a # v3.1.0
        with:
          endpoint: ${{ secrets.MUELLE_ENDPOINT }}
          site: twozeroeightthree
          secret: ${{ secrets.MUELLE_SECRET }}
          environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name == 'master' && 'next' || 'preview' }}
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      # lists the build as failed if it never got to deploy
      - if: failure() || cancelled()
        uses: haztecaso/muelle@d2c9216b438720a9e52d1464f054619fdfd28a5a # v3.1.0
        with:
          endpoint: ${{ secrets.MUELLE_ENDPOINT }}
          site: twozeroeightthree
          secret: ${{ secrets.MUELLE_SECRET }}
          environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name == 'master' && 'next' || 'preview' }}
          action: abort

  # browser tests, accessibility, visual regression and budgets on the
  # deployed site; broken links on the same build
  test:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: nix develop -c npm ci
      - run: nix develop -c npm test
      - if: ${{ !cancelled() }}
        run: nix develop -c npm run test:links
      - if: ${{ !cancelled() }}
        run: nix develop -c npm run test:lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 14

  teardown:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && !startsWith(github.event.ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: haztecaso/muelle@d2c9216b438720a9e52d1464f054619fdfd28a5a # v3.1.0
        with:
          endpoint: ${{ secrets.MUELLE_ENDPOINT }}
          site: twozeroeightthree
          secret: ${{ secrets.MUELLE_SECRET }}
          action: teardown
