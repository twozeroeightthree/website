version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # one PR for all action bumps instead of one per action
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pinned to the Playwright browsers in nixpkgs; bumped with flake.lock
      - dependency-name: "@playwright/test"
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      other:
        patterns: ["*"]
